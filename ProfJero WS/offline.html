<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - ProfJero OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 text-center">
        <div class="w-20 h-20 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
            <i class="fas fa-wifi-slash text-white text-4xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800 mb-2">You're Offline</h1>
        <p class="text-gray-600 mb-4">
            It seems you've lost your internet connection. 
            Don't worry, you can still access your cached data!
        </p>
        <div class="space-y-3">
            <button onclick="window.location.href='/'"
                    class="w-full bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition">
                <i class="fas fa-home mr-2"></i> Go to Dashboard
            </button>
            <button onclick="window.location.reload()"
                    class="w-full border border-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-50 transition">
                <i class="fas fa-sync-alt mr-2"></i> Retry Connection
            </button>
        </div>
        <div class="mt-6 pt-4 border-t border-gray-200">
            <p class="text-sm text-gray-500">
                <i class="fas fa-info-circle mr-1"></i>
                Your recent changes will sync automatically when you're back online.
            </p>
        </div>
    </div>
</body>
</html>
