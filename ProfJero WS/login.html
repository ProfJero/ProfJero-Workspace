<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ProfJero WS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        .loading-spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 animate-fade-in">
        <div class="text-center mb-8">
            <div class="flex items-center justify-center mx-auto mb-4">
                <img src="resources/profjero-logo.png" alt="ProfJero Official Logo" width="90px">
            </div>
            <h1 class="text-3xl font-bold text-gray-800">ProfJero WS</h1>
            <p class="text-gray-600 mt-2">Your Personal WorkSpace</p>
        </div>
        
        <div id="login-error" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg mb-4 text-sm"></div>
        <div id="login-success" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg mb-4 text-sm"></div>
        
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Email Address</label>
                <div class="relative">
                    <i class="fas fa-envelope absolute left-3 top-3 text-gray-400"></i>
                    <input type="email" id="email" required class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:border-indigo-500" placeholder="profjero947@gmail.com">
                </div>
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                <div class="relative">
                    <i class="fas fa-lock absolute left-3 top-3 text-gray-400"></i>
                    <input type="password" id="password" required class="w-full pl-10 pr-12 py-2 border rounded-lg focus:outline-none focus:border-indigo-500" placeholder="••••••••">
                    <button type="button" id="toggle-password" class="absolute right-3 top-3 text-gray-400 hover:text-gray-600">
                        <i class="fas fa-eye-slash"></i>
                    </button>
                </div>
            </div>
            
            <button type="submit" id="login-btn" class="w-full bg-indigo-600 text-white font-bold py-2 rounded-lg hover:bg-indigo-700 transition duration-200 flex items-center justify-center gap-2">
                <i class="fas fa-sign-in-alt"></i>
                <span>Sign In</span>
            </button>
        </form>
        
        <div class="mt-4">
            <div class="relative">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-300"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-white text-gray-500">Or continue with</span>
                </div>
            </div>
            
            <button id="google-signin" class="mt-4 w-full bg-white border border-gray-300 text-gray-700 font-bold py-2 rounded-lg hover:bg-gray-50 transition flex items-center justify-center gap-2">
                <i class="fab fa-google text-red-500"></i>
                Sign in with Google
            </button>
        </div>
        
        <div class="mt-6 text-center">
            <p class="text-gray-600">Don't have an account? 
                <a href="#" class="text-indigo-600 hover:underline font-semibold">Sign up</a>
            </p>
        </div>
    </div>
    
    <script type="module">
        import { auth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider } from './js/firebase-config.js';
        
        const loginForm = document.getElementById('login-form');
        const errorDiv = document.getElementById('login-error');
        const successDiv = document.getElementById('login-success');
        const loginBtn = document.getElementById('login-btn');
        const passwordInput = document.getElementById('password');
        
        // Password visibility toggle
        const togglePassword = document.getElementById('toggle-password');
        
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            togglePassword.querySelector('i').classList.toggle('fa-eye');
            togglePassword.querySelector('i').classList.toggle('fa-eye-slash');
        });
        
        function setLoading(isLoading) {
            if (isLoading) {
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<div class="loading-spinner w-5 h-5 border-2 border-white border-t-transparent rounded-full"></div><span>Signing in...</span>';
            } else {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>Sign In</span>';
            }
        }
        
        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
            successDiv.classList.add('hidden');
            // Auto-hide after 4 seconds
            setTimeout(() => {
                errorDiv.classList.add('hidden');
            }, 4000);
        }
        
        function showSuccess(message) {
            successDiv.textContent = message;
            successDiv.classList.remove('hidden');
            errorDiv.classList.add('hidden');
            setTimeout(() => {
                successDiv.classList.add('hidden');
            }, 2000);
        }
        
        // Custom error message mapper - hides raw Firebase errors
        function getCustomErrorMessage(errorCode) {
            const errorMessages = {
                'auth/invalid-email': 'Invalid email address format. Please check and try again.',
                'auth/user-disabled': 'This account has been disabled. Please contact support.',
                'auth/user-not-found': 'No account found with this email address. Please sign up first.',
                'auth/wrong-password': 'Incorrect password. Please try again.',
                'auth/too-many-requests': 'Too many failed login attempts. Please try again later.',
                'auth/network-request-failed': 'Network error. Please check your internet connection.',
                'auth/internal-error': 'An internal error occurred. Please try again.',
                'auth/invalid-credential': 'Invalid email or password. Please try again.',
                'auth/account-exists-with-different-credential': 'An account already exists with this email. Please sign in using your original method.'
            };
            
            return errorMessages[errorCode] || 'Login failed. Please check your credentials and try again.';
        }
        
        // Email/Password Sign In
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = passwordInput.value;
            
            // Basic validation
            if (!email) {
                showError('Please enter your email address.');
                return;
            }
            
            if (!password) {
                showError('Please enter your password.');
                return;
            }
            
            setLoading(true);
            
            try {
                // Attempt to sign in with Firebase Auth
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                console.log('Login successful for:', user.email);
                showSuccess('Login successful! Redirecting...');
                
                // Redirect to dashboard after short delay
                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);
                
            } catch (error) {
                console.error('Login error code:', error.code);
                // Show custom error message instead of Firebase's raw error
                const customMessage = getCustomErrorMessage(error.code);
                showError(customMessage);
                setLoading(false);
            }
        });
        
        // Google Sign In
        document.getElementById('google-signin').addEventListener('click', async () => {
            setLoading(true);
            
            try {
                const provider = new GoogleAuthProvider();
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                
                console.log('Google login successful for:', user.email);
                showSuccess('Google sign in successful! Redirecting...');
                
                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);
                
            } catch (error) {
                console.error('Google signin error:', error.code);
                const customMessage = getCustomErrorMessage(error.code);
                showError(customMessage);
                setLoading(false);
            }
        });
        
        // Pre-fill email for demo convenience (already has value from HTML)
        // Remove loading state if page is left during redirect
        window.addEventListener('beforeunload', () => {
            setLoading(false);
        });
    </script>
</body>
</html>
