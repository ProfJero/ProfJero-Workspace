    <script type="module">
        import { auth, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, updateProfile, db, collection, addDoc, serverTimestamp, doc, setDoc } from './js/firebase-config.js';
        
        const signupForm = document.getElementById('signup-form');
        const errorDiv = document.getElementById('signup-error');
        const successDiv = document.getElementById('signup-success');
        const signupBtn = document.getElementById('signup-btn');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirm-password');
        const matchIndicator = document.getElementById('password-match-indicator');
        
        // Password visibility toggles
        const togglePassword = document.getElementById('toggle-password');
        const toggleConfirmPassword = document.getElementById('toggle-confirm-password');
        
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            togglePassword.querySelector('i').classList.toggle('fa-eye');
            togglePassword.querySelector('i').classList.toggle('fa-eye-slash');
        });
        
        toggleConfirmPassword.addEventListener('click', () => {
            const type = confirmPasswordInput.type === 'password' ? 'text' : 'password';
            confirmPasswordInput.type = type;
            toggleConfirmPassword.querySelector('i').classList.toggle('fa-eye');
            toggleConfirmPassword.querySelector('i').classList.toggle('fa-eye-slash');
        });
        
        // Password match checking
        function checkPasswordMatch() {
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            
            if (confirmPassword.length === 0) {
                matchIndicator.classList.add('hidden');
                return;
            }
            
            matchIndicator.classList.remove('hidden');
            
            if (password === confirmPassword) {
                matchIndicator.innerHTML = '<i class="fas fa-check-circle text-green-500"></i> <span class="text-green-600">Passwords match</span>';
                matchIndicator.className = 'text-xs mt-1 text-green-600';
            } else {
                matchIndicator.innerHTML = '<i class="fas fa-times-circle text-red-500"></i> <span class="text-red-600">Passwords do not match</span>';
                matchIndicator.className = 'text-xs mt-1 text-red-600';
            }
        }
        
        passwordInput.addEventListener('input', checkPasswordMatch);
        confirmPasswordInput.addEventListener('input', checkPasswordMatch);
        
        function setLoading(isLoading) {
            if (isLoading) {
                signupBtn.disabled = true;
                signupBtn.innerHTML = '<div class="loading-spinner w-5 h-5 border-2 border-white border-t-transparent rounded-full"></div><span>Creating account...</span>';
            } else {
                signupBtn.disabled = false;
                signupBtn.innerHTML = '<i class="fas fa-user-plus"></i><span>Sign Up</span>';
            }
        }
        
        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
            successDiv.classList.add('hidden');
            setTimeout(() => errorDiv.classList.add('hidden'), 5000);
        }
        
        function showSuccess(message) {
            successDiv.textContent = message;
            successDiv.classList.remove('hidden');
            errorDiv.classList.add('hidden');
            setTimeout(() => successDiv.classList.add('hidden'), 3000);
        }
        
        // Initialize user in Firestore - FIXED to use setDoc with uid as document ID
        async function initializeUser(user, displayName) {
            try {
                // Use setDoc with document ID = user.uid to prevent duplicates and ensure proper user document creation
                const userRef = doc(db, 'users', user.uid);
                await setDoc(userRef, {
                    uid: user.uid,
                    email: user.email,
                    displayName: displayName || user.displayName || user.email.split('@')[0],
                    photoURL: user.photoURL || null,
                    createdAt: serverTimestamp(),
                    settings: {
                        theme: 'light',
                        notifications: true,
                        emailReminders: true
                    }
                });
                console.log('User document created successfully for uid:', user.uid);
                return true;
            } catch (error) {
                console.error('Error initializing user in Firestore:', error);
                throw error; // Re-throw to handle in signup flow
            }
        }
        
        // Email/Password Sign Up
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            const terms = document.getElementById('terms').checked;
            
            // Validation
            if (!name) {
                showError('Please enter your full name');
                return;
            }
            
            if (!email) {
                showError('Please enter your email address');
                return;
            }
            
            if (!password) {
                showError('Please enter a password');
                return;
            }
            
            if (password.length < 6) {
                showError('Password must be at least 6 characters long');
                return;
            }
            
            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }
            
            if (!terms) {
                showError('Please agree to the Terms of Service');
                return;
            }
            
            setLoading(true);
            
            try {
                // Create user with Firebase Auth
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // Update profile with name
                await updateProfile(user, { displayName: name });
                
                // Initialize user in Firestore
                await initializeUser(user, name);
                
                showSuccess('Account created successfully! Redirecting...');
                
                // Redirect to dashboard after 2 seconds
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
                
            } catch (error) {
                console.error('Signup error details:', error);
                switch (error.code) {
                    case 'auth/email-already-in-use':
                        showError('This email is already registered. Please sign in instead.');
                        break;
                    case 'auth/invalid-email':
                        showError('Please enter a valid email address.');
                        break;
                    case 'auth/weak-password':
                        showError('Password is too weak. Please use a stronger password.');
                        break;
                    default:
                        showError('Failed to create account: ' + (error.message || 'Please try again.'));
                }
                setLoading(false);
            }
        });
        
        // Google Sign Up
        document.getElementById('google-signup').addEventListener('click', async () => {
            setLoading(true);
            
            try {
                const provider = new GoogleAuthProvider();
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                
                // Initialize user in Firestore
                await initializeUser(user, user.displayName);
                
                showSuccess('Account created successfully! Redirecting...');
                
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
                
            } catch (error) {
                console.error('Google signup error:', error);
                showError('Failed to sign up with Google. Please try again.');
                setLoading(false);
            }
        });
        
        // Remove loading state on page navigation cancel
        window.addEventListener('beforeunload', () => {
            setLoading(false);
        });
    </script>
</body>
</html>
